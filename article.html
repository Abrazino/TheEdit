<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Story — The Edit</title><link rel="stylesheet" href="styles.css"><style>.article-wrap{max-width:800px;margin:60px auto 90px;width:90%}.article-wrap img{width:100%;max-height:460px;object-fit:cover;margin:25px 0}.article-wrap h1{font:700 clamp(36px,6vw,58px)/1.1 "Playfair Display",serif}.article-body{font-size:17px;line-height:1.9;color:var(--muted);white-space:pre-line}</style></head><body><header class="site-header"><a class="brand" href="index.html">the<span>edit</span><i>.</i></a><a class="admin-link" href="index.html">← Back to stories</a></header><main class="article-wrap" id="article">Loading story…</main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="app.js"></script><script>(async()=>{const slug=new URLSearchParams(location.search).get("slug"),sb=window.getSupabaseClient?.(),root=document.getElementById("article");if(!sb){root.textContent="Configure Supabase first.";return}const {data:s,error}=await sb.from("articles").select("title,excerpt,body,cover_image,published_at,created_at,categories(name),profiles(display_name)").eq("slug",slug).eq("status","published").maybeSingle();if(error||!s){root.innerHTML="<h1>Story not found</h1><a href='index.html'>Return home</a>";return}document.title=s.title+" — The Edit";root.innerHTML=`<p class="eyebrow">${escapeHTML(s.categories?.name||"Lifestyle")} · ${new Date(s.published_at||s.created_at).toLocaleDateString()}</p><h1>${escapeHTML(s.title)}</h1><p>By ${escapeHTML(s.profiles?.display_name||"The Edit Desk")}</p><img src="${escapeHTML(s.cover_image||"")}" alt="${escapeHTML(s.title)}"><div class="article-body">${escapeHTML(s.body)}</div>`})()</script></body></html>
